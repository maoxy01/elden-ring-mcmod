<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>赐福像素资源</title><style>*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#ededeb;color:#292c2a;letter-spacing:0}header{padding:16px 24px;border-bottom:1px solid #aaa;display:flex;gap:20px;align-items:center;flex-wrap:wrap}h1{font-size:20px;margin:0}button{font:inherit;border:1px solid #999;background:#dedfdb;color:#292c2a;padding:6px 12px;cursor:pointer}button[aria-pressed=true]{background:#4b514e;color:white}main{padding:24px;max-width:1200px;margin:auto}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:18px}figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:12px;min-height:155px}figcaption{text-align:center} .sprite{width:96px;height:96px;image-rendering:pixelated;background-repeat:no-repeat}body.dark{background:#313734;color:#eee}footer{padding:20px 24px;border-top:1px solid #999;color:inherit}@keyframes flame{to{background-position:0 -384px}}body.paused .sprite{animation-play-state:paused!important}</style><header><h1>赐福像素资源</h1><button id="light" aria-pressed="true">浅色</button><button id="dark" aria-pressed="false">深色</button><button id="play" aria-pressed="false" title="暂停动画" aria-label="暂停动画">Ⅱ</button></header><main><section><figure><div class="sprite " style="background-image:url('textures/map/grace_ancient_undiscovered.png');background-size:96px 96px;"></div><figcaption>古老 · 未激活（仅列表）</figcaption></figure><figure><div class="sprite " style="background-image:url('textures/map/grace_ancient_discovered.png');background-size:96px 96px;"></div><figcaption>古老 · 已发现</figcaption></figure><figure><div class="sprite " style="background-image:url('textures/map/grace_ancient_public.png');background-size:96px 96px;"></div><figcaption>古老 · 公共</figcaption></figure><figure><div class="sprite " style="background-image:url('textures/map/grace_ancient_private.png');background-s 资源草案 · 尚未游戏接入</footer><script>document.querySelector('#light').onclick=()=>{document.body.classList.remove('dark');light.setAttribute('aria-pressed','true');dark.setAttribute('aria-pressed','false')};document.querySelector('#dark').onclick=()=>{document.body.classList.add('dark');light.setAttribute('aria-pressed','false');dark.setAttribute('aria-pressed','true')};document.querySelector('#play').onclick=()=>{let p=document.body.classList.toggle('paused');play.setAttribute('aria-pressed',p);play.textContent=p?'▶':'Ⅱ';play.title=p?'播放动画':'暂停动画';play.setAttribute('aria-label',play.title)};</script></html>
