<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>像素 HUD · V0.2</title><link rel="stylesheet" href="preview.css"></head>
<body><header><h1>像素 HUD <span>V0.2</span></h1><div class="top-tools"><label>场景 <select id="preset"><option value="reference">默认</option><option value="low">低蓝与空耐力</option><option value="explore">探索</option><option value="underwater">水下</option><option value="multi">多排血量</option></select></label><button id="export" type="button">导出透明 PNG</button></div></header>
<main><div class="view-tools"><div class="segments" role="group" aria-label="查看区域"><button data-view="full" aria-pressed="true">整体</button><button data-view="hud" aria-pressed="false">底部</button><button data-view="map" aria-pressed="false">地图</button><button data-view="boss" aria-pressed="false">Boss</button></div><label>画幅 <select id="viewport"><option value="480,270">16:9</option><option value="640,270">21:9</option><option value="360,270">4:3</option><option value="320,180">大 GUI</option><option value="270,480">竖屏</option></select></label></div>
<div class="stage"><canvas id="preview" width="480" height="270" aria-label="像素 HUD 示意预览"></canvas></div>
<section class="controls" aria-label="HUD 数值"><label>生命 <output id="health-value"></output><input id="health" type="range" min="0" max="20" value="18"></label><label>蓝条 <output id="fp-value"></output><input id="fp" type="range" min="0" max="90" value="60"></label><label>耐力 <output id="stamina-value"></output><input id="stamina" type="range" min="0" max="120" value="92"></label><label>Boss <output id="boss-value"></output><input id="boss" type="range" min="0" max="100" value="68"></label><label>装备 <select id="equipment"></select></label><div class="toggles"><label><input type="checkbox" id="showBoss" checked>Boss 血条</label><label><input type="checkbox" id="showMap" checked>小地图</label><label><input type="checkbox" id="underwater">水下</label><label><input type="checkbox" id="effects">状态</label></div></section>
<footer>演示数值与示例地图 · 背景来自项目测试截图 · <a href="README.md">美术交接</a> · <a href="reference/user-layout.png">参考图</a></footer></main><script src="data.js"></script><script src="preview.js"></script></body></html>
