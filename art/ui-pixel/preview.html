<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>战灰与 FP</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;letter-spacing:0;background:#e8ece9;color:#29342f}header{padding:20px 24px;display:flex;align-items:center;gap:24px;border-bottom:1px solid #9caaa1}h1{font-size:22px;margin:0}h2{font-size:17px;margin:0 0 18px}main{max-width:1100px;margin:auto;padding:24px}section{padding:24px 0;border-bottom:1px solid #9caaa1}.icons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}.icon{min-width:0}.zoom{width:96px;height:96px;display:block;background:#888e89;margin-bottom:12px}img{image-rendering:pixelated}.native{height:40px;display:flex;align-items:center;gap:12px}.name{margin:12px 0}.examples{display:flex;gap:32px;flex-wrap:wrap}.menu{width:330px;height:210px;max-width:100%;background:#303330;border:1px solid #181a18;padding:8px;color:#e8e8e8;font-size:10px}.menu-title{display:flex;justify-content:space-between;height:23px}.columns{display:grid;grid-template-columns:minmax(0,150px) minmax(0,150px);gap:12px}.row{height:16px;margin-bottom:2px;width:100%;display:flex;align-items:center;gap:2px;padding:0 2px;border:1px solid #232323;box-shadow:inset 1px 1px #aaa,inset -1px -1px #444;background:#747474;color:white;font:9px system-ui;cursor:pointer;text-align:left}.row img{width:16px;height:16px;flex:none}.row span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row:hover,.row:focus-visible{background:#8b8b8b;outline:1px solid #eee}.row:disabled{color:#aaa;background:#424242;box-shadow:inset 1px 1px #626262;cursor:default}.row:disabled img{opacity:.45}.hud{width:300px;height:132px;image-rendering:pixelated;max-width:100%}.mode{display:flex;gap:8px}button.swatch{width:24px;height:24px;border:2px solid #71857a;cursor:pointer}.light{background:#e8ece9}.night{background:#242c27}.dark{background:#242c27;color:#e6ede7}footer{padding:24px}a{color:#2b8177}.dark a{color:#8cd2bd}.entry{display:flex;align-items:center;gap:14px;margin-top:20px}@media(max-width:620px){header,main{padding:16px}.icons{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.columns{gap:6px}.row{font-size:9px}}
</style>
<header><h1>战灰与 FP</h1><div class="mode"><button class="swatch light" title="浅底" aria-label="浅底" onclick="document.body.classList.remove('dark');drawHud()"></button><button class="swatch night" title="深底" aria-label="深底" onclick="document.body.classList.add('dark');drawHud()"></button></div></header>
<main><section><h2>图标</h2><div class="icons" id="icons"></div><div class="entry"><img src="../grace-pixel/textures/ui/grace_ashes.png" width="16" height="16" alt="战灰装配入口">战灰装配</div></section><section><h2>专注值</h2><canvas id="hud" class="hud" width="300" height="132"></canvas></section><section><h2>赐福 · 战灰装配</h2><div class="examples"><div class="menu"><div class="menu-title"><span>赐福</span><span>战灰装配</span></div><div class="columns"><div><button class="row"><img src="../grace-pixel/textures/ui/grace_travel.png" alt="旅行"><span>关卡前方</span></button><button class="row"><img src="../grace-pixel/textures/ui/grace_rest.png" alt="休息"><span>休息（恢复 FP）</span></button></div><div id="rows"></div></div></div></div></section></main>
<footer><a href="../../docs/UI-PIXEL-HANDOFF-20261015.md">交接说明</a> · <a href="assets.json">素材清单</a></footer>
<script src="preview-data.js"></script><script>
const data=window.UI_ASSETS;let ready=false;const images={};
function drawHud(){if(!ready)return;const c=document.getElementById('hud'),ctx=c.getContext('2d'),dark=document.body.classList.contains('dark');ctx.clearRect(0,0,300,132);ctx.imageSmoothingEnabled=false;ctx.font='11px monospace';[0,.1,1].forEach((r,i)=>{const x=24,y=20+i*40;ctx.fillStyle='#000000c0';ctx.fillRect(x-1,y-1,152,8);ctx.fillStyle='#2a2a2a';ctx.fillRect(x,y,150,6);ctx.fillStyle='#3f7fd0';ctx.fillRect(x,y,Math.floor(150*r),6);ctx.drawImage(images.fp,x-18,y-5,16,16);ctx.fillStyle=dark?'#9fc3f0':'#294f7f';ctx.fillText(`FP ${Math.round(100*r)}/100`,x+154,y+6)})}
(async()=>{for(const a of data.assets){const im=new Image();im.src=a.file;await im.decode();if(a.size[0]===16){images[a.id.split(':').pop()]=im;const box=document.createElement('div');box.className='icon';box.innerHTML=`<img class="zoom" src="${a.file}" alt="${a.name}"><div class="name">${a.name}</div><div class="native"><img width="16" height="16" src="${a.file}" alt="16像素"><img width="32" height="32" src="${a.file.replace('_16','_32')}" alt="32像素"></div>`;document.getElementById('icons').append(box)}}
const rows=[['spinning_slash','回旋斩 · 可装配',false],['heavy_thrust','重刺 · 武器不匹配',true],['stamp_upward_cut','踏前上斩 · 已绑定',false],['stamp_upward_cut','踏前上斩 · 尚未获得的战灰（长名称检查）',true]];for(const [id,label,disabled] of rows){const b=document.createElement('button');b.className='row';b.disabled=disabled;b.title=label;b.innerHTML=`<img src="textures/${id}_16.png" alt=""><span>${label}</span>`;document.getElementById('rows').append(b)}ready=true;drawHud();window.UI_READY=true})();
</script></html>
