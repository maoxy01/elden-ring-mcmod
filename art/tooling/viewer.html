<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Margit 01C - Model Review</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font: 13px Arial, sans-serif; color: #26302e; }
    canvas { width: 100%; height: 100%; display: block; }
    header { position: absolute; top: 0; left: 0; right: 0; min-height: 54px; padding: 10px 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; background: #ffffffee; border-bottom: 1px solid #d4dcda; z-index: 2; }
    strong { font-size: 14px; font-weight: 600; white-space: nowrap; }
    select { max-width: 150px; min-height: 30px; border: 1px solid #b9c3c0; border-radius: 3px; color: #26302e; background: #fff; padding: 4px 6px; font: inherit; }
    label { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
    #stats { margin-left: auto; color: #56635e; font-size: 12px; }
    #status { position: absolute; bottom: 12px; left: 16px; font-size: 12px; color: #56635e; }
    #views { position: absolute; top: 74px; left: 0; right: 0; display: none; justify-content: space-around; color: #56635e; pointer-events: none; }
    @media (max-width: 600px) { header { gap: 8px; padding: 8px 10px; } #stats { display: none; } select { max-width: 116px; } strong { width: 100%; } #views { top: 116px; } }
  </style>
</head>
<body>
  <header>
    <strong>Margit / 01C</strong>
    <select id="view" aria-label="View"><option value="orbit">Perspective</option><option value="front">Front</option><option value="side">Side</option><option value="back">Back</option><option value="sheet">Three Views</option></select>
    <select id="animation" aria-label="Animation"><option value="rest">Rest Pose</option></select>
    <label><input id="play" type="checkbox" checked>Play</label>
    <label><input id="bones" type="checkbox">Bones</label>
    <span id="stats"></span>
  </header>
  <div id="views"><span>FRONT</span><span>SIDE</span><span>BACK</span></div>
  <div id="status"></div>
  <script>/* SCENE_DATA */</script>
  <script>/* VIEWER_BUNDLE */</script>
</body>
</html>
