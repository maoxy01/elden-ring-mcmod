<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>武器结构修订</title>
<style>
:root{--bg:#eef0ed;--ink:#26332c;--panel:#d7dfd8;--accent:#355d49}*{box-sizing:border-box;letter-spacing:0}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Microsoft YaHei UI",sans-serif}header{padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}h1,h2,p{margin:0}h1{font-size:26px}h2{font-size:22px}a{color:inherit;text-underline-offset:4px}nav{display:flex;gap:20px;flex-wrap:wrap}main{max-width:1200px;margin:auto;padding:0 24px 32px}.controls{display:flex;gap:20px;align-items:center;flex-wrap:wrap;padding:16px;background:var(--panel)}label{display:flex;gap:8px;align-items:center}input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}select{min-height:44px;font:inherit;max-width:100%;border:0;background:var(--bg);padding:8px}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:32px;padding:24px 0}.side{min-width:0}.side h2{margin-bottom:12px}.detail{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:16px;background:var(--panel);padding:16px}.zoom{width:100%;aspect-ratio:1;object-fit:contain;image-rendering:pixelated}.native{display:flex;align-items:center;gap:20px;min-height:48px}.native img{image-rendering:pixelated;flex:none}.stage{width:100%;height:auto;image-rendering:pixelated}.notes{padding:20px 0;max-width:70ch}.notes p{margin:8px 0}.strip{display:flex;align-items:end;gap:24px;flex-wrap:wrap;padding:32px 0}.strip button{border:0;background:var(--panel);padding:12px;width:160px;color:var(--ink)}.strip img{display:block;width:128px;height:128px;image-rendering:pixelated}.strip span{display:block;line-height:1.5;margin-top:8px}footer{padding:24px;display:flex;gap:24px;flex-wrap:wrap;background:var(--panel)}.dark{--bg:#252d28;--ink:#e4ebe3;--panel:#3d4a40;--accent:#87b49a}@media(max-width:800px){.detail{grid-template-columns:1fr}.zoom{max-width:192px;justify-self:center}.pair{gap:16px}}@media(max-width:480px){header{padding:16px}main{padding:0 16px 24px}h1{font-size:24px}.controls{padding:12px;gap:12px}.controls label:first-child{width:100%}select{width:100%}.pair{gap:12px}.detail{padding:8px;gap:8px}.native{gap:8px}.stage{min-width:0}.strip{gap:12px}.strip button{width:calc(50% - 6px)}.strip img{width:100%;height:auto;aspect-ratio:1}footer{padding:16px}.notes{font-size:16px}}
.controls label:first-child{white-space:nowrap;min-width:0}.controls select{min-width:0;flex:1}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.strip button{width:100%}.strip img{width:100%;height:auto;aspect-ratio:1}
@media(max-width:700px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}.strip button{width:100%}}
</style>
<header><h1>武器结构修订</h1><nav><a href="DESIGN.md">设计依据</a><a href="manifest.json">候选清单</a></nav></header>
<main><div class="controls" data-ui><label>武器 <select id="item"></select></label><label><input type="checkbox" id="dark">深色背景</label><label><input type="checkbox" id="left">左手</label><a id="model">Blockbench 模型</a></div>
<section class="pair" id="pair" aria-label="修改前与已采用新版对照"></section>
<section class="notes"><h2 id="name"></h2><p id="facts"></p><p>五件新版已采用并同步当前美术；旧版已备份，尚未接入游戏验收。</p></section><section class="strip" id="strip" aria-label="五件已采用新版"></section></main>
<footer><a href="../../../docs/ART-WEAPON-TASTE-REVISION-20261018.md">修订与验证记录</a><a href="../full/preview.html">当前正式美术</a></footer>
<script src="preview-data.js"></script><script>
const D=window.IDENTITY,imgs=new Map(),$=id=>document.getElementById(id);let current=D.candidates[0];
async function im(src){if(!imgs.has(src)){const i=new Image();i.src=src;await i.decode();imgs.set(src,i)}return imgs.get(src)}
function held(c,a,image){const ctx=c.getContext('2d'),left=$('left').checked;ctx.imageSmoothingEnabled=false;ctx.fillStyle=$('dark').checked?'#3d4a40':'#d7dfd8';ctx.fillRect(0,0,300,440);ctx.fillStyle='#819384';ctx.fillRect(132,232,34,28);ctx.fillRect(130,260,40,56);ctx.fillRect(130,316,17,58);ctx.fillRect(153,316,17,58);ctx.fillRect(114,262,16,56);ctx.fillRect(170,262,16,56);const span=image.src.endsWith(a.variants[0].before)?a.beforeSourceSpanPixels:a.sourceSpanPixels;const x=left?122:178,y=307,k=a.worldLengthBlocks*80/span;ctx.save();ctx.translate(x,y);ctx.rotate((left?1:-1)*Math.PI/4);ctx.scale(left?-k:k,k);ctx.drawImage(image,-a.anchorPixels[0],-a.anchorPixels[1]);ctx.restore();ctx.fillStyle='#b6c6b9';ctx.fillRect(x-4,y-4,8,8)}
async function render(){const a=current;document.body.classList.toggle('dark',$('dark').checked);$('pair').replaceChildren();for(const side of ['before','after']){const s=document.createElement('div');s.className='side';const title=document.createElement('h2');title.textContent=side==='before'?'修改前':'已采用';s.append(title);const detail=document.createElement('div');detail.className='detail';const img=document.createElement('img'),v=a.variants[0],url=side==='before'?v.before:v.url;img.className='zoom';img.src=url;img.alt=a.name+(side==='before'?'修改前':'已采用新版');const c=document.createElement('canvas');c.width=300;c.height=440;c.className='stage';detail.append(img,c);s.append(detail);const native=document.createElement('div');native.className='native';for(const n of [16,32]){const v=a.variants.find(v=>v.state==='gui_'+n),i=document.createElement('img');i.src=side==='before'?v.before:v.url;i.width=n;i.height=n;i.alt=a.name+' '+n+'像素';native.append(i)}s.append(native);$('pair').append(s);held(c,a,await im(url))}$('name').textContent=a.name;$('facts').textContent=a.worldLengthBlocks.toFixed(3)+' 格 · 局部厚度 1/16 格 · 保留登记握点';$('model').href=a.model;window.WEAPON_READY=true}
for(const a of D.candidates){const o=document.createElement('option');o.value=a.id;o.textContent=a.name;$('item').append(o);const b=document.createElement('button');b.title='审看'+a.name;b.innerHTML='<img src="'+a.variants[0].url+'" alt="'+a.name+'"><span>'+a.name+'</span>';b.onclick=()=>{current=a;$('item').value=a.id;render()};$('strip').append(b)}
$('item').onchange=()=>{current=D.candidates.find(a=>a.id===$('item').value);render()};$('dark').onchange=render;$('left').onchange=render;render().catch(console.error);
</script></html>
