<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>刃线与盾缘修订</title>
<style>*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#edf0ee;color:#27352d;font:14px system-ui;letter-spacing:0}header{padding:16px 24px;border-bottom:1px solid #9caea3;display:flex;align-items:center;gap:20px;flex-wrap:wrap}h1{font-size:22px;margin:0}h2{font-size:18px;margin:0 0 18px}label{display:inline-flex;align-items:center;gap:6px}main{max-width:1100px;margin:auto;padding:24px}section{padding:20px 0;border-bottom:1px solid #9caea3}.pair{display:grid;grid-template-columns:1fr 1fr;gap:24px}.side{min-width:0}.side>p{margin:8px 0}.native{display:flex;align-items:center;gap:16px;height:48px}.native img{flex:none}.zoom{width:192px;height:192px;max-width:100%;image-rendering:pixelated;background:#b8c4bc}.stage{display:block;width:240px;max-width:100%;height:auto;image-rendering:pixelated}img{image-rendering:pixelated}.swatch{width:24px;height:24px;border:2px solid #78907f;cursor:pointer}.swatch[data-dark=no]{background:#edf0ee}.swatch[data-dark=yes]{background:#252d27}.dark{background:#252d27;color:#e6eee7}.dark .zoom{background:#414e45}.details{line-height:1.7;font-size:13px}.audit{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}.audit div{border-bottom:1px solid #9caea3;padding:12px 0;min-width:0}.audit img{width:32px;height:32px;vertical-align:middle;margin-right:12px}.name,.reason,.features{display:none}.reveal .name{display:inline}.reveal .reason,.reveal .features{display:block}footer{padding:24px}a{color:#287968}.dark a{color:#91cdb6}@media(max-width:600px){header,main{padding:16px}.pair{gap:12px}.native{gap:6px}.zoom{width:128px;height:128px}.audit{grid-template-columns:1fr 1fr}.audit div{font-size:12px}}</style>
<header><h1>武器辨识度对照</h1><label><input id="reveal" type="checkbox" checked>揭晓名称</label><label><input id="left" type="checkbox">左手</label><button class="swatch" data-dark="no" aria-label="浅底" title="浅底"></button><button class="swatch" data-dark="yes" aria-label="深底" title="深底"></button></header>
<main id="main"></main><footer><a href="../../../docs/ART-CURVE-REVISION-20261016.md">审阅说明</a> · <a href="manifest.json">逐项记录</a></footer>
<script src="preview-data.js"></script><script>
const data=window.IDENTITY,main=document.getElementById('main'),images=new Map();let ready=false;
async function im(url){if(images.has(url))return images.get(url);const i=new Image();i.src=url;await i.decode();images.set(url,i);return i}
function held(canvas,a,image){const ctx=canvas.getContext('2d'),left=document.getElementById('left').checked;ctx.imageSmoothingEnabled=false;ctx.fillStyle=document.body.classList.contains('dark')?'#3a473f':'#d2ddd5';ctx.fillRect(0,0,300,440);ctx.fillStyle='#889e8e';ctx.fillRect(130,260,40,56);ctx.fillRect(132,232,34,28);ctx.fillRect(130,316,17,58);ctx.fillRect(153,316,17,58);ctx.fillRect(114,262,16,56);ctx.fillRect(170,262,16,56);const x=left?122:178,y=307,k=a.worldLengthBlocks*80/a.sourceSpanPixels;ctx.save();ctx.translate(x,y);ctx.rotate(a.id==='shield'?0:(left?1:-1)*Math.PI/4);ctx.scale(left?-k:k,k);ctx.drawImage(image,-a.anchorPixels[0],-a.anchorPixels[1]);ctx.restore();ctx.fillStyle='#b6c6b9';ctx.fillRect(x-4,y-4,8,8)}
function render(){if(!ready)return;document.body.classList.toggle('reveal',document.getElementById('reveal').checked);for(const a of data.candidates)for(const side of ['before','after'])held(document.getElementById(a.id+'-'+side),a,images.get(side==='before'?a.variants[0].before:a.variants[0].url))}
(async()=>{for(const [index,a] of data.candidates.entries()){const section=document.createElement('section');section.innerHTML=`<h2>候选 ${index+1} <span class="name">· ${a.name}</span></h2><div class="pair"></div><p class="features">${a.features.join(' · ')}</p><p class="details">${a.worldLengthBlocks.toFixed(3)} 格 · 厚度 1/16 格 · 待审候选</p>`;main.append(section);const heldV=a.variants[0];for(const side of ['before','after']){const div=document.createElement('div');div.className='side';div.innerHTML=`<p>${side==='before'?'当前':'候选'}</p><div class="native"><span>16</span><img width="16" height="16"><span>32</span><img width="32" height="32"></div><img class="zoom" width="192" height="192"><canvas class="stage" id="${a.id}-${side}" width="300" height="440"></canvas>`;section.querySelector('.pair').append(div);for(const n of [16,32]){const v=a.variants.find(v=>v.state==='gui_'+n);const url=side==='before'?v.before:v.url;await im(url);div.querySelector(`.native img[width="${n}"]`).src=url}const url=side==='before'?heldV.before:heldV.url;await im(url);div.querySelector('.zoom').src=url}}
const s=document.createElement('section');s.innerHTML='<h2>42 项筛选</h2><div class="audit"></div>';main.append(s);for(const [index,a] of data.audit.entries()){const v=a.currentPngs.find(v=>v.state==='gui_32')||a.currentPngs[0],url='../../../'+v.file;await im(url);const d=document.createElement('div');d.innerHTML=`<img src="${url}" alt=""><span>${String(index+1).padStart(2,'0')}</span> <span class="name">${a.name}</span><p>${a.decision}</p><p class="reason">${a.reason}</p>`;s.querySelector('.audit').append(d)}ready=true;render();window.IDENTITY_READY=true})().catch(e=>{console.error(e);main.append('素材加载失败')});
document.getElementById('reveal').onchange=render;document.getElementById('left').onchange=render;for(const b of document.querySelectorAll('[data-dark]'))b.onclick=()=>{document.body.classList.toggle('dark',b.dataset.dark==='yes');render()};
</script></html>
