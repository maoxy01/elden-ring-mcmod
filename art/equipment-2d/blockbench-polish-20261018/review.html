<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blockbench 物品优化</title>
<style>
*{box-sizing:border-box;letter-spacing:0}body{margin:0;background:#eef0ec;color:#283732;font:16px/1.6 "Microsoft YaHei UI",sans-serif}header,footer{padding:20px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}h1{font-size:26px;margin:0}h2{font-size:20px;margin:0}a{color:#775239;text-underline-offset:4px}nav{display:flex;gap:20px;flex-wrap:wrap}main{max-width:1200px;margin:auto;padding:0 24px 32px}.toolbar{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:16px;background:#dce3df}label{display:flex;align-items:center;gap:8px;min-width:0}select{font:inherit;padding:8px;border:0;min-height:44px;max-width:100%;min-width:0;background:#eef0ec;color:inherit}.pair{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:24px 0}.side{min-width:0}.side img{display:block;width:100%;aspect-ratio:1;object-fit:contain;image-rendering:pixelated;background:#46534b}.side h2{margin-bottom:12px}p{margin:8px 0 24px}.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}button{font:inherit;text-align:left;background:#dce3df;border:0;border-radius:0;color:inherit;padding:12px;cursor:pointer}button img{width:100%;aspect-ratio:1;object-fit:contain;display:block;image-rendering:pixelated}button span{display:block}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #775239;outline-offset:3px}footer{background:#dce3df}@media(max-width:780px){.gallery{grid-template-columns:repeat(3,minmax(0,1fr))}.pair{gap:16px}}@media(max-width:480px){header,footer{padding:16px}main{padding:0 16px 24px}h1{font-size:24px}h2{font-size:18px}.toolbar{gap:12px;padding:12px}label{width:100%}select{flex:1}.pair{gap:12px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
</style>
<header><h1>Blockbench 物品优化</h1><nav><a href="items-optimized.bbmodel">可编辑工程</a><a href="../../../docs/ART-BLOCKBENCH-POLISH-20261018.md">修改记录</a><a href="validation.json">检查记录</a></nav></header>
<main><div class="toolbar"><label>物品 <select id="item"></select></label><label>视图 <select id="view"><option value="native">Blockbench 原生视图</option></select></label></div><div class="pair"><section class="side"><h2>修改前</h2><img id="before" alt="修改前"></section><section class="side"><h2 id="after-title">Blockbench 优化</h2><img id="after" alt="Blockbench 优化后"></section></div><p id="info"></p><div id="gallery" class="gallery"></div></main><footer><span>12 件材质优化 · 16 件保留定版 · 未替换游戏资源</span><a href="before-current.bbmodel">修改前工程</a></footer>
<script src="review-data.js"></script><script>
const D=window.BB_REVIEW,$=id=>document.getElementById(id);let a=D.items.find(a=>a.editable);
function render(){const v=$('view').value;const s=a.states.find(s=>s.state===v);$('before').src=v==='native'?'qa/'+a.id+'-before.png':'before/'+s.before.split('/').pop();$('after').src=v==='native'?'qa/'+a.id+'-front.png':'textures/'+s.output.split('/').pop();$('before').alt=a.name+' 修改前';$('after').alt=a.name+' '+(a.editable?'优化后':'保留定版');$('after-title').textContent=a.editable?'Blockbench 优化':'保留定版';$('info').textContent=a.name+' · '+a.worldLengthBlocks.toFixed(3)+' 格 · 原版厚度 · '+(a.editable?'材质与碎色整理，轮廓不变':'已采用版本不修改');window.REVIEW_READY=a.id+':'+v}
function choose(id){a=D.items.find(a=>a.id===id);$('item').value=id;$('view').replaceChildren(new Option('Blockbench 原生视图','native'));if(a.editable)for(const s of a.states)$('view').add(new Option(s.state,s.state));render();history.replaceState(null,'','#'+id)}
for(const i of D.items){$('item').add(new Option(i.name,i.id));const b=document.createElement('button');b.title='查看'+i.name;const img=document.createElement('img');img.src='qa/'+i.id+'-front.png';img.alt=i.name;const s=document.createElement('span');s.textContent=i.name+(i.editable?' · 优化候选':' · 保留');b.append(img,s);b.onclick=()=>choose(i.id);$('gallery').append(b)}$('item').onchange=()=>choose($('item').value);$('view').onchange=render;choose(D.items.some(a=>a.id===location.hash.slice(1))?location.hash.slice(1):a.id);
</script></html>
