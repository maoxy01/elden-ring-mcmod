<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>战技网格审查</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#28343a;background:#edf1f3;font:14px system-ui,"Microsoft YaHei",sans-serif;letter-spacing:0}
header{display:flex;align-items:center;flex-wrap:wrap;gap:16px;padding:14px 20px;background:white;border-bottom:1px solid #c7d1d5}
h1{font-size:20px;margin:0}select{font:inherit;padding:7px;max-width:100%;border:1px solid #b6c2c8;border-radius:4px;background:white}
label{display:flex;align-items:center;gap:6px}input[type=range]{width:150px;accent-color:#267f76}input[type=checkbox]{accent-color:#267f76}
#viewport{position:relative;width:100%;height:780px}canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));pointer-events:none}
.label{display:flex;align-items:flex-end;justify-content:center;padding:12px;font-weight:600;text-align:center;font-size:14px}
@media(max-width:700px){header{padding:12px;gap:10px}#viewport{height:1600px}#labels{grid-template-columns:repeat(2,minmax(0,1fr))}.label{font-size:13px;padding:10px}}
</style></head>
<body><header><h1>战技网格</h1><select id="effect" aria-label="战技"></select><label><input type="checkbox" id="playing" checked>播放</label><input id="time" type="range" min="0" max="19" value="4" aria-label="时间"><output id="frame">20%</output></header>
<main id="viewport"><div id="labels"></div></main>
<script src="meshes.js"></script><script src="preview.bundle.js"></script></body></html>
