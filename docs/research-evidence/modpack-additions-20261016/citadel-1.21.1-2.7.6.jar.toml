logoFile = "citadel.png" #optional
credits = "Gegy1000" #optional
authors = "Alexthe666" #optional
description = '''A shared code library for many of Alexthe666's mods. Code used from LLibrary with permission.''' #mandatory (Supports multiline text)
[[mixins]]
config = "citadel.mixins.json"
[[dependencies.citadel]] #optional
modId = "neoforge" #mandatory
type = "required" #mandatory (Can be one of "required", "optional", "incompatible" or "discouraged")
versionRange = "[4,)" #mandatory
ordering = "NONE" # The order that this dependency should load in relation to your mod, required to be either 'BEFORE' or 'AFTER' if the dependency is not mandatory
side = "BOTH" # Side this dependency is applied on - 'BOTH', 'CLIENT' or 'SERVER'
[[dependencies.citadel]]
modId = "minecraft"
type = "required" #mandatory (Can be one of "required", "optional", "incompatible" or "discouraged")
versionRange = "[1.21, 1.22)"
ordering = "NONE"
side = "BOTH"
[[accessTransformers]]
## The 'resources' directory represents the root output directory of the resources
file = "META-INF/accesstransformer.cfg"
