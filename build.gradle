plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'com.dsh.eldencombat'
version = '0.2.0'
description = 'Elden Combat - 纯原版战斗扩展 (Minecraft 1.21.1 / NeoForge)'
apply from: 'gradle/equipment-2d.gradle'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    exclusiveContent {
        forRepository { maven { url = 'https://www.cursemaven.com' } }
        filter { includeGroup 'curse.maven' }
    }
}

neoForge {
    // 锁定 NeoForge 版本（MC 1.21.1 -> 21.1.x）
    version = '21.1.219'

    runs {
        client {
            client()
            if (project.hasProperty('vfxSmoke')) {
                gameDirectory = layout.buildDirectory.dir('vfxSmoke')
                systemProperty 'eldencombat.vfxSmoke', 'true'
                // 快速回归：-PvfxSegments=2 只跑前两段（默认 18 段全跑）。
                if (project.hasProperty('vfxSegments')) systemProperty 'eldencombat.vfxSegments', project.property('vfxSegments').toString()
                // 单段诊断：-PvfxFlame 只跑火墙（带墙场景），-PvfxMissing 只跑强制缺图段。
                if (project.hasProperty('vfxFlame')) systemProperty 'eldencombat.vfxFlame', 'true'
                if (project.hasProperty('vfxMissing')) systemProperty 'eldencombat.vfxMissing', 'true'
                // 定高俯瞰机位：判断"美术没画出来"还是"第一人称相机没对到"。
                if (project.hasProperty('vfxVantage')) systemProperty 'eldencombat.vfxVantage', 'true'
                // V1 受控取证（固定观察机位 + 分层取样 + 严格配对 + 两个负例）；V2/V3 诊断开关同目录串行运行。
                if (project.hasProperty('vfxFixed')) systemProperty 'eldencombat.vfxFixed', 'true'
                if (project.hasProperty('vfxFixedSegments')) systemProperty 'eldencombat.vfxFixedSegments', project.property('vfxFixedSegments').toString()
                if (project.hasProperty('vfxForceCore')) systemProperty 'eldencombat.vfxForceCore', 'true'
                if (project.hasProperty('vfxBudgetZero')) systemProperty 'eldencombat.vfxBudgetZero', 'true'
                if (project.hasProperty('vfxLatch')) systemProperty 'eldencombat.vfxLatch', 'true'
                // 动作语义夹具：逐次挥击是否真出图 + 施法者挥击次数 + 起跳/落地时序（不拍差分图）。
                if (project.hasProperty('vfxSemantics')) systemProperty 'eldencombat.vfxSemantics', 'true'
                if (project.hasProperty('vfxSemanticsCases')) systemProperty 'eldencombat.vfxSemanticsCases', project.property('vfxSemanticsCases').toString()
                // 负例：恢复"原地蹦"的旧起跳参数，用来证明语义门禁真的抓得住它。
                if (project.hasProperty('vfxLegacyHop')) systemProperty 'eldencombat.vfxLegacyHop', 'true'
                programArgument '--quickPlaySingleplayer'
                programArgument 'vfx-integration'
            }
            if (project.hasProperty('vfxReload')) {
                // 真降级/恢复场景（框架 §7 第 2/3 行、§9"真降级/恢复"）：隔离资源包，独立目录，独立世界。
                gameDirectory = layout.buildDirectory.dir('vfxReload')
                systemProperty 'eldencombat.vfxSmoke', 'true'
                systemProperty 'eldencombat.vfxReload', 'true'
                programArgument '--quickPlaySingleplayer'
                programArgument 'vfx-integration'
            }
            if (project.hasProperty('gracePrototype')) {
                gameDirectory = layout.buildDirectory.dir('gracePrototypeClient')
                systemProperty 'eldencombat.gracePrototype', 'true'
                if (project.hasProperty('graceManual')) systemProperty 'eldencombat.graceManual', 'true'
                if (project.hasProperty('graceReload')) systemProperty 'eldencombat.graceReload', 'true'
                if (project.hasProperty('graceMenu')) systemProperty 'eldencombat.graceMenu', 'true'
                programArgument '--quickPlaySingleplayer'
                programArgument 'grace-prototype'
            }
            if (project.hasProperty('clientSmoke')) {
                gameDirectory = layout.buildDirectory.dir('clientSmoke')
                systemProperty 'eldencombat.clientSmoke', 'true'
                if (project.hasProperty('artAcceptance')) systemProperty 'eldencombat.artAcceptance', 'true'
                if (project.hasProperty('providerAcceptance')) systemProperty 'eldencombat.providerAcceptance', 'true'
                if (project.hasProperty('clientSmokeReload')) systemProperty 'eldencombat.persistenceReload', 'true'
                if (project.hasProperty('functionalSmoke')) systemProperty 'eldencombat.functionalSmoke', 'true'
                if (project.hasProperty('gripSmoke')) {
                    systemProperty 'eldencombat.gripSmoke', 'true'
                    if (project.hasProperty('gripItem')) systemProperty 'eldencombat.gripItem', project.property('gripItem').toString()
                    systemProperty 'eldencombat.smokeSlim', project.hasProperty('slimSmoke').toString()
                    programArgument '--uuid'
                    programArgument project.hasProperty('slimSmoke') ? '00000000-0000-0000-0000-000000000000' : '00000000-0000-0000-0000-000000000009'
                }
                programArgument '--quickPlaySingleplayer'
                programArgument 'codex-player-smoke'
            }
            if (project.hasProperty('artAcceptance')) systemProperty 'eldencombat.artAcceptance', 'true'
            // dsh：战技的游戏内验收场景（权限隔离，仅此开关启用）
            if (project.hasProperty('skillSmoke')) {
                gameDirectory = layout.buildDirectory.dir('skillSmoke')
                systemProperty 'eldencombat.skillSmoke', 'true'
                programArgument '--quickPlaySingleplayer'
                programArgument 'codex-skill-smoke'
            }
            // 普通战灰（§2.2）的引擎夹具：目录/绑定校验/单段运行时/扣费/卸除
            if (project.hasProperty('ashSmoke')) {
                gameDirectory = layout.buildDirectory.dir('ashSmoke')
                systemProperty 'eldencombat.ashSmoke', 'true'
                programArgument '--quickPlaySingleplayer'
                programArgument 'ash-smoke'
            }
            if (project.hasProperty('manualSkills')) {
                gameDirectory = layout.buildDirectory.dir('manualSkills')
                systemProperty 'eldencombat.manualSkills', 'true'
                if (layout.buildDirectory.file('manualSkills/saves/codex-skill-smoke/level.dat').get().asFile.isFile()) {
                    programArgument '--quickPlaySingleplayer'
                    programArgument 'codex-skill-smoke'
                }
            }
            // dsh：装备 2D 的实机人工观感场景。隔离目录 + 已备好的创造模式存档，**没有夹具接管操作**，
            // 玩家自己按 E 找物品、F5 切视角、F 换手，用来核对握持/朝向/遮挡的观感。
            // 存档只在第一次运行复制（见 prepareEquipmentViewWorld），之后由玩家自己改，工具不再覆盖。
            if (project.hasProperty('equipmentView')) {
                gameDirectory = layout.buildDirectory.dir('equipmentView')
                if (layout.buildDirectory.file('equipmentView/saves/equipment-view/level.dat').get().asFile.isFile()) {
                    programArgument '--quickPlaySingleplayer'
                    programArgument 'equipment-view'
                }
            }
            if (project.hasProperty('sourceMotion')) {
                if (!project.hasProperty('manualSkills')) {
                    throw new GradleException('sourceMotion requires manualSkills; source assets are local-test-only.')
                }
                systemProperty 'eldencombat.sourceMotionProfile',
                        layout.buildDirectory.file('elden-source/retargeted/profile.json').get().asFile.absolutePath
            }
            if (project.hasProperty('packGameDir')) gameDirectory = file(project.property('packGameDir'))
            if (project.hasProperty('packIntegration')) {
                jvmArgument '-Xms256m'
                jvmArgument '-Xmx2560m'
                jvmArgument '-XX:ActiveProcessorCount=4'
                systemProperty 'eldencombat.packIntegration', 'true'
                if (project.hasProperty('packRestart')) systemProperty 'eldencombat.packRestart', 'true'
                if (project.hasProperty('packSingle')) {
                    systemProperty 'eldencombat.packSingle', 'true'
                    programArgument '--quickPlaySingleplayer'
                    programArgument 'pack-integrated'
                } else {
                    programArgument '--quickPlayMultiplayer'
                    programArgument '127.0.0.1:25568'
                }
                programArgument '--username'
                programArgument 'PackTester'
            }
        }
        server {
            server()
            if (project.hasProperty('gracePrototype')) {
                gameDirectory = layout.buildDirectory.dir('gracePrototypeServer')
                systemProperty 'eldencombat.gracePrototype', 'true'
            }
            programArgument '--nogui'
            if (project.hasProperty('weaponServerSmoke')) {
                gameDirectory = layout.buildDirectory.dir('weaponServerSmoke')
                systemProperty 'eldencombat.weaponServerSmoke', 'true'
                programArgument '--port'
                programArgument '25567'
            }
            if (project.hasProperty('serverSmoke')) {
                gameDirectory = layout.buildDirectory.dir('serverSmoke')
                systemProperty 'eldencombat.serverSmoke', 'true'
                programArgument '--port'
                programArgument '25566'
            }
            if (project.hasProperty('packGameDir')) gameDirectory = file(project.property('packGameDir'))
            if (project.hasProperty('packIntegration')) {
                systemProperty 'eldencombat.packIntegration', 'true'
                if (project.hasProperty('packRestart')) systemProperty 'eldencombat.packRestart', 'true'
                jvmArgument '-Xms256m'
                jvmArgument '-Xmx1536m'
                jvmArgument '-XX:ActiveProcessorCount=4'
            }
        }
    }

    mods {
        eldencombat {
            sourceSet sourceSets.main
        }
    }
}

// ---------------------------------------------------------------------------
// 美术资产同步：Codex 维护 art/margit/，构建时复制进生成资源目录，
// 不污染 src/main/resources（源码树只保留手写内容）。
// ---------------------------------------------------------------------------
def artDir = layout.projectDirectory.dir('art/margit')
def generatedArt = layout.buildDirectory.dir('generated/artResources')

tasks.register('syncArt', Sync) {
    inputs.file('art/ui-pixel/assets.json')
    from('art/ui-pixel/textures') {
        include '*.png'
        eachFile { details -> details.path = 'assets/eldencombat/textures/ui/' + details.name.replace('_16.png', '.png') }
    }
    doFirst {
        def ui = new groovy.json.JsonSlurper().parse(file('art/ui-pixel/assets.json'))
        if (ui.assets.size() != 8) throw new GradleException('UI admission requires the eight delivered PNGs')
        ui.assets.each { asset ->
            def png = file('art/ui-pixel/' + asset.file)
            if (png.canonicalFile.parentFile != file('art/ui-pixel/textures').canonicalFile)
                throw new GradleException('UI asset escaped source root')
            def digest = java.security.MessageDigest.getInstance('SHA-256').digest(png.bytes).encodeHex().toString()
            def image = javax.imageio.ImageIO.read(png)
            if (digest != asset.sha256 || image == null || image.width != asset.size[0] || image.height != asset.size[1])
                throw new GradleException('UI asset hash/dimension mismatch: ' + png)
        }
        if (fileTree('art/ui-pixel/textures').matching { include '*.png' }.files.size() != 8)
            throw new GradleException('Unadmitted UI PNG in source directory')
    }
    from('art/vfx-2d/textures/particle') {
        include '**/frame_*.png'
        into 'assets/eldencombat/textures/particle'
    }
    // 4: thin equipment meshes also ship for the ordinary weapon collection.
    inputs.property('assetLayoutVersion', 4)
    from(artDir) {
        include 'margit.png'
        include '*.model.json'
        include '*.animations.json'
    }
    into(generatedArt)
    from('art/grace-pixel') {
        include 'textures/**/*.png'
        eachFile { details -> details.path = 'assets/eldencombat/' + details.sourcePath }
    }
    from('art/weapon-proportions') {
        include 'profiles.json', 'sword-grip-regions.json', 'utility-grip-regions.json'
        eachFile { details -> details.path = 'assets/eldencombat/weapons/' + (details.name == 'profiles.json' ? 'proportions.json' : details.name.replace('-', '_')) }
    }
    from('art/player') {
        include '*.json', 'equipment.png', 'fx/*.png'
        eachFile { details ->
            def name = details.name
            if (name.endsWith('.model.json') || name.endsWith('.skin.json') || name == 'equipment.hit-shapes.json' || name == 'player.presentation.json') {
                details.path = 'assets/eldencombat/skeletons/player/' + name
            } else if (name.endsWith('.animations.json') || name == 'player.visual-offsets.json') {
                details.path = 'assets/eldencombat/animations/player/' + name
            } else if (name == 'equipment.png') {
                details.path = 'assets/eldencombat/textures/item/equipment.png'
            } else if (details.sourcePath.startsWith('fx/')) {
                details.path = 'assets/eldencombat/textures/particle/' + name
            } else if (name.startsWith('combat.')) {
                details.path = 'assets/eldencombat/effects/' + name
            } else {
                details.exclude()
            }
        }
    }
    // 追忆武器（游戏减面版）：只接 art/remembrance-game，不接 art/remembrance 的高细节编辑源。
    // 同步模型、预烘焙网格、图集与索引；.bbmodel / 预览 / qa / 备份不进产物 JAR。
    from('art/remembrance-game') {
        include '*.model.json'
        include '*.mesh.json'
        include 'weapons.png'
        include 'catalog.json'
        eachFile { details ->
            def name = details.name
            if (name == 'weapons.png') {
                details.path = 'assets/eldencombat/textures/item/remembrance.png'
            } else if (name == 'catalog.json') {
                details.path = 'assets/eldencombat/weapons/remembrance.catalog.json'
            } else if (name.endsWith('.model.json') || name.endsWith('.mesh.json')) {
                details.path = 'assets/eldencombat/skeletons/items/remembrance/' + name
            } else {
                details.exclude()
            }
        }
    }
    // 武器：同步模型、网格、机械动画和图集。
    // .bbmodel / preview.html / catalog.json 不进产物 JAR。
    from('art/weapons') {
        include '*.model.json'
        include '*.mesh.json'
        include '*.animations.json'
        include 'weapons.png'
        eachFile { details ->
            def name = details.name
            if (name.endsWith('.model.json') || name.endsWith('.mesh.json')) {
                details.path = 'assets/eldencombat/skeletons/items/' + name
            } else if (name.endsWith('.animations.json')) {
                details.path = 'assets/eldencombat/animations/items/' + name
            } else if (name == 'weapons.png') {
                details.path = 'assets/eldencombat/textures/item/weapons.png'
            } else {
                details.exclude()
            }
        }
    }
    eachFile { details ->
        switch (details.sourcePath) {
            case 'margit.png':
                details.path = 'assets/eldencombat/textures/entity/margit.png'
                break
            case 'margit.animations.json':
                details.path = 'assets/eldencombat/animations/margit.animations.json'
                break
            default:
                if (details.sourcePath.endsWith('.model.json') && !details.path.startsWith('assets/')) {
                    details.path = 'assets/eldencombat/skeletons/entity/' + details.sourcePath
                }
        }
    }
    includeEmptyDirs = false
}

sourceSets.main.resources.srcDir(generatedArt)
tasks.named('processResources') { dependsOn 'syncArt' }

tasks.register('compileSkillFxExporter', JavaCompile) {
    dependsOn 'classes'
    source = files('tools/skill-fx/EffectPreviewExporter.java')
    classpath = sourceSets.main.runtimeClasspath
    destinationDirectory = layout.buildDirectory.dir('skill-fx-exporter/classes')
    options.release = 21
    options.encoding = 'UTF-8'
}
tasks.register('exportSkillFx', JavaExec) {
    dependsOn 'compileSkillFxExporter'
    classpath = sourceSets.main.runtimeClasspath + files(layout.buildDirectory.dir('skill-fx-exporter/classes'))
    mainClass = 'EffectPreviewExporter'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    args file('art/skill-fx/meshes.js').absolutePath,
            file('build/moddev/artifacts/neoforge-21.1.219-client-extra-aka-minecraft-resources.jar').absolutePath
}
tasks.named('check') { dependsOn 'exportSkillFx' }

// ---------------------------------------------------------------------------
// 隔离测试存档的准备（踩过的坑：`clean` 会删掉 build/，而 `--quickPlaySingleplayer`
// 找不到存档时客户端会**静默退出**——日志里连一行 smoke 都没有，看起来像"构建失败"。
// 所以把"从 run/world 复制存档"变成任务，跑 -PclientSmoke 时自动执行。
// ---------------------------------------------------------------------------
tasks.register('prepareClientSmokeWorld', Sync) {
    description = '把 run/world 复制成隔离的客户端 smoke 存档 codex-player-smoke'
    group = 'verification'
    onlyIf { file('run/world/level.dat').isFile() }
    onlyIf { !project.hasProperty('clientSmokeReload') }
    from('run/world') { exclude 'session.lock' }
    into layout.buildDirectory.dir('clientSmoke/saves/codex-player-smoke')
    doLast { logger.lifecycle('[smoke] 已准备客户端测试存档 build/clientSmoke/saves/codex-player-smoke') }
}

tasks.matching { it.name == 'runClient' }.configureEach {
    if (project.hasProperty('artAcceptance')) {
        doLast {
            def grace = project.hasProperty('gracePrototype')
            def log = layout.buildDirectory.file((grace ? 'gracePrototypeClient' : 'clientSmoke') + '/logs/latest.log').get().asFile
            def marker = grace ? 'GRACE_ART_COMPLETE:' : project.hasProperty('providerAcceptance') ? 'ART_PROVIDER_COMPLETE:' : 'ART_FLAIL_COMPLETE:'
            if (!log.isFile() || !log.text.contains(marker) || log.text.contains('ART_ACCEPTANCE_FAIL') || log.text.contains('GRACE_ART_FAIL'))
                throw new GradleException('Art acceptance fixture failed or incomplete; inspect isolated log')
        }
    }
    if (project.hasProperty('vfxSmoke')) {
        // VFX 运行收口门禁：缺完成标记、或出现任何 VFX_SMOKE_FAIL/INCOMPLETE 即失败退出非 0。
        // 各模式还要各自的完成标记（受控 V1 / 锁存 V3 / CORE / 预算0 诊断），避免拿别的模式的日志顶替。
        doLast {
            def log = layout.buildDirectory.file('vfxSmoke/logs/latest.log').get().asFile
            def mode = project.hasProperty('vfxLatch') ? 'VFX_LATCH_COMPLETE:'
                    : project.hasProperty('vfxForceCore') ? 'VFX_CORE_COMPLETE:'
                    : project.hasProperty('vfxBudgetZero') ? 'VFX_BUDGET0_COMPLETE:'
                    : project.hasProperty('vfxSemantics') ? 'VFX_SEMANTICS_COMPLETE:'
                    : project.hasProperty('vfxFixed') ? 'VFX_FIXED_COMPLETE:' : 'VFX_SMOKE_COMPLETE:'
            if (!log.isFile() || !log.text.contains('VFX_SMOKE_COMPLETE:') || !log.text.contains(mode)
                    || log.text.contains('VFX_SMOKE_FAIL') || log.text.contains('VFX_SMOKE_INCOMPLETE'))
                throw new GradleException('VFX fixture failed or incomplete (' + mode + '); inspect isolated log')
        }
    }
    if (project.hasProperty('vfxReload')) {
        // 资源包降级/恢复场景门禁：缺完成标记、或出现任何 VFX_SMOKE_FAIL/INCOMPLETE 即失败退出非 0。
        doLast {
            def log = layout.buildDirectory.file('vfxReload/logs/latest.log').get().asFile
            if (!log.isFile() || !log.text.contains('VFX_SMOKE_COMPLETE:')
                    || log.text.contains('VFX_SMOKE_FAIL') || log.text.contains('VFX_SMOKE_INCOMPLETE'))
                throw new GradleException('VFX reload fixture failed or incomplete; inspect isolated log')
        }
    }
    if (project.hasProperty('clientSmoke')) {
        dependsOn 'prepareClientSmokeWorld'
    }
    if (project.hasProperty('ashSmoke')) {
        dependsOn 'prepareAshSmokeWorld'
    }
    if (project.hasProperty('equipmentView')) {
        dependsOn 'prepareEquipmentViewWorld'
    }
}

tasks.register('prepareAshSmokeWorld', Sync) {
    description = '把 run/world 复制成隔离的普通战灰测试存档 ash-smoke'
    group = 'verification'
    onlyIf { file('run/world/level.dat').isFile() }
    from('run/world') { exclude 'session.lock' }
    into layout.buildDirectory.dir('ashSmoke/saves/ash-smoke')
}

// dsh：装备 2D 人工观感（-PequipmentView）的隔离存档。直接复用跑过夹具、玩家已经是创造模式
// 的世界（saveEverything 存过 playerGameType=1），省得每次手工建世界/刷物品。
// 只在目标不存在时复制：一旦玩家进去改过东西，工具不再覆盖；想重来就自己删掉
// build/equipmentView/saves/equipment-view 再跑一次。
tasks.register('prepareEquipmentViewWorld', Sync) {
    description = '把创造模式测试存档复制成 build/equipmentView/saves/equipment-view'
    group = 'verification'
    def smoke = file('build/clientSmoke/saves/codex-player-smoke')
    def fallback = file('run/world')
    def source = new File(smoke, 'level.dat').isFile() ? smoke : fallback
    onlyIf { new File(source, 'level.dat').isFile() }
    onlyIf { !layout.buildDirectory.file('equipmentView/saves/equipment-view/level.dat').get().asFile.isFile() }
    from(source) { exclude 'session.lock' }
    into layout.buildDirectory.dir('equipmentView/saves/equipment-view')
    doLast {
        logger.lifecycle('[equipmentView] 已准备存档 build/equipmentView/saves/equipment-view（来源 {}）', source)
        if (source == fallback) {
            logger.lifecycle('[equipmentView] 注意：smoke 存档不存在，回退用 run/world —— 那份是服务端世界，' +
                    '开局可能是生存模式，进游戏后按 Esc→对局域网开放→允许作弊 再 /gamemode creative')
        }
    }
}

tasks.register('prepareServerSmokeDir', Copy) {
    description = '把 run/ 的 eula.txt 与 server.properties 复制到隔离的服务端 smoke 目录'
    group = 'verification'
    onlyIf { file('run/eula.txt').isFile() }
    from('run/eula.txt')
    from('run/server.properties')
    into layout.buildDirectory.dir('serverSmoke')
}

tasks.matching { it.name == 'runServer' }.configureEach {
    if (project.hasProperty('gracePrototype')) {
        doLast {
            def log=layout.buildDirectory.file('gracePrototypeServer/logs/latest.log').get().asFile
            if (!log.isFile() || log.text.contains('GRACE_PROTO_FAIL') || !log.text.contains('GRACE_PROTO_SERVER_COMPLETE'))
                throw new GradleException('Grace prototype server did not complete; inspect isolated log')
        }
    }
    if (project.hasProperty('serverSmoke')) {
        dependsOn 'prepareServerSmokeDir'
        doLast {
            def log = layout.buildDirectory.file('serverSmoke/logs/latest.log').get().asFile
            if (!log.isFile() || log.text.contains('SERVER_SMOKE_FAIL') || !log.text.contains('SERVER_SMOKE_COMPLETE')) {
                throw new GradleException('Dedicated smoke did not complete successfully; inspect serverSmoke/logs/latest.log')
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'file.encoding', 'UTF-8'
}

tasks.named('jar') {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    // 夹具一律不进发布产物：用具名清单会漏（VfxFixedHarness/VfxSemanticsHarness 就是这样漏进去的），
    // 所以按"testing 包里所有 *Harness*（含 $ 内部类）"整类排除，再加一条自检任务核对。
    exclude 'com/dsh/eldencombat/testing/*Harness*'
    exclude 'com/dsh/eldencombat/testing/ClientSmokeHarness*'
    exclude 'com/dsh/eldencombat/testing/ServerSmokeHarness*'
    exclude 'com/dsh/eldencombat/testing/SkillSmokeHarness*'
    exclude 'com/dsh/eldencombat/testing/GracePrototypeHarness*'
    exclude 'com/dsh/eldencombat/testing/GraceClientPrototypeHarness*'
    exclude 'com/dsh/eldencombat/testing/AshSmokeHarness*'
    exclude 'com/dsh/eldencombat/testing/SelectedArtAcceptanceHarness*'
    exclude 'com/dsh/eldencombat/testing/GraceArtAcceptanceHarness*'
    exclude 'com/dsh/eldencombat/testing/VfxIntegrationHarness*'
}

/**
 * 发布产物自检：JAR 里不得出现任何夹具类（{@code *Harness*}）。
 * 之前只按具名清单排除，新增夹具会被静默带进发布包——这条门禁就是补那个洞。
 */
tasks.register('verifyJarHasNoHarness') {
    dependsOn 'jar'
    doLast {
        def jarFile = layout.buildDirectory.file('libs/eldencombat-0.2.0.jar').get().asFile
        if (!jarFile.isFile()) throw new GradleException('jar not built: ' + jarFile)
        def leaked = new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            zip.entries().findAll { it.name.contains('Harness') }.collect { it.name }
        }
        if (!leaked.isEmpty())
            throw new GradleException('release jar contains fixture classes: ' + leaked)
        logger.lifecycle('verifyJarHasNoHarness: OK (no *Harness* entry)')
    }
}

dependencies {
    compileOnly files('docs/research-evidence/modpack-additions-20261016/jars/combat_roll-neoforge-2.0.6+1.21.1.jar',
            'docs/research-evidence/modpack-additions-20261016/jars/player-animation-lib-forge-2.0.4+1.21.1.jar',
            'docs/research-evidence/modpack-additions-20261016/jars/sophisticatedbackpacks-1.21.1-3.25.21.1475.jar',
            'docs/research-evidence/modpack-additions-20261016/jars/sophisticatedcore-1.21.1-1.3.100.1348.jar',
            'docs/research-evidence/modpack-additions-20261016/jars/alexsmobs-1.22.17.jar',
            'docs/research-evidence/modpack-additions-20261016/jars/citadel-1.21.1-2.7.6.jar')
    if (project.hasProperty('providerAcceptance')) {
        def providerJar = file('docs/research-evidence/reuse-audit-20261013/spartan_weaponry_unofficial-1.2.3-1.21.1.jar')
        def sha = java.security.MessageDigest.getInstance('SHA-256').digest(providerJar.bytes).encodeHex().toString()
        if (sha != '84d3ddafb519e2f5e03f2681ff52c30c92c9512181f61a7a7487399a0179888f')
            throw new GradleException('Spartan acceptance JAR hash mismatch')
        runtimeOnly files(providerJar)
    }
    compileOnly files('build/gracePrototype-dependencies/waystones-neoforge-1.21.1-21.1.46.jar',
            'build/gracePrototype-dependencies/balm-neoforge-1.21.1-21.0.66.jar',
            'build/gracePrototype-dependencies/journeymap-api-compile-only.jar')
    if (project.hasProperty('gracePrototype')) {
        runtimeOnly files('build/gracePrototype-dependencies/waystones-neoforge-1.21.1-21.1.46.jar',
                'build/gracePrototype-dependencies/balm-neoforge-1.21.1-21.0.66.jar',
                'build/gracePrototype-dependencies/journeymap-neoforge-1.21.1-6.0.9.jar')
    }
    // 用户要求去掉 Epic Fight：本模组不再依赖任何战斗模组，只用 NeoForge + 原版。
    if (project.hasProperty('packSmoke')) {
        def lock = new groovy.json.JsonSlurper().parse(file(findProperty('packLock') ?: 'modpack/mods.lock.json'))
        def side = project.hasProperty('packServer') || project.hasProperty('serverSmoke') ? 'server' : 'client'
        def cache = findProperty('packDependencies') ?: 'build/modpack-dependencies'
        runtimeOnly files(lock.mods.findAll { it.env[side] == 'required' }.collect {
            def jar = file(cache + '/' + it.path.substring(5))
            if (!jar.isFile() || java.security.MessageDigest.getInstance('SHA-512').digest(jar.bytes).encodeHex().toString() != it.hashes.sha512)
                throw new GradleException('Unverified pack dependency: ' + it.path)
            jar
        })
    }
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // core / skeleton 只依赖这三个库，单测里显式提供（游戏内由 NeoForge 提供）
    testImplementation 'org.joml:joml:1.10.5'
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testImplementation 'org.slf4j:slf4j-api:2.0.16'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.16'
}

// 2D 装备路径的验收测试要把正式 routes/2d.json 喂给真实的 EquipmentRouteSnapshot 解析器和真实的
// display 矩阵数学，所以测试源集需要拿到与主源码相同的 Minecraft/NeoForge 类。这里只增加类路径，
// 不启动客户端：被覆盖到的都是纯解析与矩阵运算（无 GL、无注册表自举、无资源加载）。
sourceSets.test.compileClasspath += configurations.compileClasspath
sourceSets.test.runtimeClasspath += configurations.compileClasspath


apply from: 'gradle/minimap-defaults.gradle'

['runClient': 'CLIENT', 'runServer': 'SERVER'].each { taskName, side ->
    tasks.named(taskName) {
        doLast {
            if (project.hasProperty('packIntegration')) {
                def log = file(project.property('packGameDir').toString() + '/logs/latest.log').getText('UTF-8')
                if (!log.contains('PACK_INTEGRATION_' + side + '_COMPLETE') ||
                        (project.hasProperty('packSingle') && !log.contains('PACK_INTEGRATION_SERVER_COMPLETE')) ||
                        log.contains('PACK_INTEGRATION_FAIL') || log.contains('PACK_CLIENT_FAIL'))
                    throw new GradleException('Pack integration failed; inspect the isolated latest.log')
            }
        }
    }
}
